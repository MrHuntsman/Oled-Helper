[package]
name = "OledHelper"
version = "1.0.2"
description = "OLED Helper - near-black calibration tool"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytemuck = "1"
text-raster = { path = "text-raster" }
# Read-only font inspection (family/subfamily/weight/variable detection) for
# the system-font replacement feature. Font rewriting (name-table
# impersonation) will use read-fonts + write-fonts in a later step.
ttf-parser = "0.25"
# Font construction for the name-table impersonation step. write-fonts 0.41
# re-exports its matching read-fonts (0.33.1) as `write_fonts::read`, so we
# depend only on write-fonts and use that re-export (a direct read-fonts dep
# would resolve to a different version and its types would not match).
write-fonts = { version = "0.41", features = ["read"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Timestamp formatting for early_log's file logger (same crate+version the
# log plugin uses internally, so early lines match the plugin's format).
time = { version = "0.3", features = ["formatting", "macros"] }
# "unstable" is required for the main window's detachable webview: the app
# keeps one long-lived window and adds/removes the webview inside it to release
# WebView2's memory while idle in the tray (see src/main_window.rs). Without it,
# Manager::get_window / get_webview / Window::add_child are not compiled in.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# Direct dependency for the custom TargetKind::Dispatch target that captures
# pre-WebView log records for the startup replay (already in the lock file as
# a transitive dep of tauri-plugin-log).
fern = "0.7"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_ColorSystem", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials"] }
# Portable self-updater (no installer): fetches a small JSON manifest from
# the GitHub release, downloads the new exe next to the running one, and
# swaps it in place after the old process exits.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
tauri-plugin-window-state = "2.4.1"

# WebView2 memory policy (see src/webview_env.rs). Both crates are already in
# the graph through wry/tauri-runtime-wry; depending on them directly pins the
# COM types Tauri hands back from `PlatformWebview::controller()`, so no second
# copy of webview2-com is pulled in. windows-core has to stay on the 0.61 line
# the webview2-com crates use, not the 0.62 line the `windows` dependency
# above uses, otherwise the COM interfaces and their traits do not unify.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
