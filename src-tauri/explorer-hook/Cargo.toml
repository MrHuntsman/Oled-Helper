[package]
name = "explorer-hook"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Injected into explorer.exe to force grayscale font antialiasing"

[lib]
crate-type = ["cdylib"]

[dependencies]
iced-x86 = "1"
swash = "0.2"
text-raster = { path = "../text-raster" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
